# Blueprint de Render: API + front (mismo servicio). La base de datos es externa (Neon).
# Render → New → Blueprint → selecciona el repositorio. HTTPS y certificado automáticos.
services:
  - type: web
    name: rumbo-nomada
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    # El plan free no admite preDeployCommand: migraciones + seed (idempotentes) al arrancar
    startCommand: npx prisma migrate deploy && node prisma/seed.js && node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false   # cadena de Neon con ?sslmode=require
      - key: ADMIN_API_KEY
        generateValue: true
      - key: APP_URL
        sync: false   # p. ej. https://rumbonomada.com
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Rumbo Nómada <hola@rumbonomada.com>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
